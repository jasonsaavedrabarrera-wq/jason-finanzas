<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · Jason Saavedra</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,500;75,900&display=swap" rel="stylesheet">
<style>
  :root{--jf-navy:#07101f;--jf-mint:#3ce6b0;--jf-on-mint:#07101f}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--jf-navy);color:#fff;
       font-family:"Archivo",system-ui,sans-serif;font-stretch:75%;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-weight:900;text-transform:uppercase;font-size:clamp(36px,10vw,56px);line-height:1.02;margin:24px 0 12px}
  .hl{background:var(--jf-mint);color:var(--jf-on-mint);padding:0 .14em;display:inline-block;transform:rotate(-1.5deg)}
  p{color:rgba(255,255,255,.72);font-size:18px;max-width:420px;margin:0 auto 24px}
  a{color:var(--jf-mint);font-weight:700}
</style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="jason.finanzas" height="34">
    <h1>¡Gracias, <span class="hl">recibido</span>!</h1>
    <p>Reviso tu caso y te contacto por el medio que elegiste, normalmente dentro de 24 horas hábiles.</p>
    <a href="https://www.instagram.com/jason.finanzas/">Volver a @jason.finanzas</a>
  </main>
</body>
</html>
